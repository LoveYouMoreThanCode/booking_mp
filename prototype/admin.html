<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>价格管理 · 管理端</title>
<style>
  :root{
    --blue:#1989FA; --blue-soft:#E8F3FF;
    --green:#07C160; --orange:#FF9500; --red:#FA5151;
    --bg:#F2F3F5; --text:#1A1A1A; --text-sub:#8A8A8A; --border:#EDEDED;
    --booked-bg:#F0F0F0; --past-bg:#FAFAFA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#E9EAEC;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
  }

  .phone{
    width:100%;max-width:420px;height:100dvh;max-height:900px;
    background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 12px 48px rgba(0,0,0,.18);
  }
  @media(min-width:520px){ .phone{border-radius:22px;} }

  /* ── 顶部 ─────────────────────────────────── */
  .topbar{background:#fff;padding:14px 16px 10px;border-bottom:1px solid var(--border);flex:none;}
  .tb-head{display:flex;align-items:center;gap:10px;}
  .tb-head h1{margin:0;font-size:17px;font-weight:600;}
  .topbar .sub{margin-top:4px;font-size:11.5px;color:var(--text-sub);line-height:1.5;}
  .navlink{
    margin-left:auto;font-size:12.5px;color:var(--blue);text-decoration:none;
    border:1px solid var(--blue);border-radius:999px;padding:5px 12px;
    display:flex;align-items:center;gap:5px;white-space:nowrap;transition:background .14s;
  }
  .navlink:hover{background:var(--blue-soft);}
  .navlink b{
    background:var(--red);color:#fff;border-radius:999px;
    min-width:16px;height:16px;font-size:10.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
    font-variant-numeric:tabular-nums;
  }
  .navlink b.zero{display:none;}

  /* ── 日期条 ───────────────────────────────── */
  .datebar{
    display:flex;gap:8px;overflow-x:auto;padding:11px 16px;background:#fff;
    flex:none;scrollbar-width:none;border-bottom:1px solid var(--border);
  }
  .datebar::-webkit-scrollbar{display:none;}
  .date{
    flex:none;min-width:58px;padding:7px 4px;border-radius:10px;background:var(--bg);
    text-align:center;cursor:pointer;transition:all .16s ease;border:1px solid transparent;
  }
  .date .dow{font-size:11px;color:var(--text-sub);line-height:1.3;}
  .date .dnum{font-size:15px;font-weight:600;margin-top:2px;line-height:1.2;}
  .date.active{background:var(--blue);border-color:var(--blue);}
  .date.active .dow,.date.active .dnum{color:#fff;}

  /* ── 工具栏 ───────────────────────────────── */
  .toolbar{background:#fff;flex:none;border-bottom:1px solid var(--border);padding:10px 16px 12px;}
  .tb-row{display:flex;align-items:center;gap:8px;}
  .tb-row + .tb-row{margin-top:9px;}
  .count{font-size:12.5px;color:var(--text-sub);}
  .count b{color:var(--blue);font-size:14px;font-variant-numeric:tabular-nums;}
  .spacer{margin-left:auto;}

  .price-input{
    width:74px;border:1px solid var(--border);border-radius:8px;padding:7px 9px;
    font-size:14px;font-family:inherit;background:#FAFAFA;outline:none;
    font-variant-numeric:tabular-nums;text-align:center;
  }
  .price-input:focus{border-color:var(--blue);background:#fff;}
  .price-label{font-size:12.5px;color:var(--text-sub);}

  .mini{
    border:1px solid var(--border);background:#fff;color:var(--text);
    border-radius:8px;padding:7px 12px;font-size:12.5px;font-family:inherit;
    cursor:pointer;white-space:nowrap;transition:all .14s;
  }
  .mini:hover{border-color:#D0D0D0;}
  .mini:disabled{color:#C8C8C8;cursor:not-allowed;border-color:#F0F0F0;}
  .mini.primary{
    background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;
  }
  .mini.primary:disabled{background:#D8D8D8;border-color:#D8D8D8;color:#fff;}
  .mini.danger:hover{border-color:var(--red);color:var(--red);}

  .stat{font-size:11px;color:#B0B0B0;margin-top:8px;}
  .stat b{color:var(--orange);font-weight:600;}

  /* ── 网格 ─────────────────────────────────── */
  .grid-scroll{flex:1;overflow:auto;background:#fff;-webkit-overflow-scrolling:touch;}
  table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;}
  .grid th,.grid td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);}

  .grid thead th{
    position:sticky;top:0;z-index:2;background:#fff;height:38px;
    font-size:12.5px;font-weight:600;white-space:nowrap;
  }
  .grid th.corner{
    position:sticky;left:0;top:0;z-index:3;background:#fff;
    width:50px;min-width:50px;font-size:10.5px;font-weight:400;color:var(--text-sub);
  }
  .grid td.time{
    position:sticky;left:0;z-index:1;background:#fff;
    width:50px;min-width:50px;height:46px;text-align:center;
    font-size:12px;color:var(--text-sub);font-weight:500;
    font-variant-numeric:tabular-nums;
  }

  .grid td.hour{padding:0;height:46px;}
  .halves{display:flex;height:100%;}
  .half{
    position:relative;flex:1;display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:600;color:var(--green);
    cursor:pointer;user-select:none;font-variant-numeric:tabular-nums;
    transition:background .1s ease,color .1s ease;
  }
  .half + .half{border-left:1px dashed #E4E4E4;}

  /* 手改过的格子：橙色数字 + 左上角小点 */
  .half.override{color:var(--orange);}
  .half.override::after{
    content:'';position:absolute;top:3px;left:3px;
    width:4px;height:4px;border-radius:50%;background:var(--orange);
  }

  /* 已被占用：底色区分，但价格仍可见（老板要能看出这段卖了多少钱） */
  .half.booked{background:var(--booked-bg);color:#A8A8A8;font-weight:400;}
  .half.booked.override{color:#C99A4E;}
  .half.pending{background:#FFF7E6;color:#D9A441;font-weight:400;}
  .half.pending.override{color:#C98A20;}
  .half.past{background:var(--past-bg);color:#D8D8D8;font-weight:400;}

  /* 选中：蓝色高亮，与客人端的绿色区分开 */
  .half.sel{
    background:var(--blue)!important;color:#fff!important;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
  }
  .half.sel.override::after{background:#fff;}

  /* ── 底部说明 ─────────────────────────────── */
  .foot{
    flex:none;background:#fff;border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    font-size:11px;color:var(--text-sub);line-height:1.6;
  }
  .foot b{color:var(--text);font-weight:600;}
  .foot-bar{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .foot-bar .mini{margin-left:auto;}
  .warn{color:var(--orange);flex:1;line-height:1.4;}

  /* ── 提示条 ───────────────────────────────── */
  .toast{
    position:absolute;left:50%;bottom:78px;transform:translate(-50%,10px);
    background:rgba(0,0,0,.8);color:#fff;font-size:13px;
    padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s;z-index:30;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="phone">

  <div class="topbar">
    <div class="tb-head">
      <h1>价格管理</h1>
      <a class="navlink" href="orders.html">预约管理 <b id="pendingBadge">0</b></a>
    </div>
    <div class="sub">拖动或点击选择时段，统一改价。每格 = 半小时</div>
  </div>

  <div class="datebar" id="datebar"></div>

  <div class="toolbar">
    <div class="tb-row">
      <span class="count">已选 <b id="selCount">0</b> 个时段</span>
      <span class="spacer"></span>
      <button class="mini" id="clearSel" disabled>清空选择</button>
    </div>
    <div class="tb-row">
      <span class="price-label">设为 ¥</span>
      <input class="price-input" id="priceInput" type="number" min="0" step="1" placeholder="0">
      <button class="mini primary" id="applyBtn" disabled>应用</button>
      <span class="spacer"></span>
      <button class="mini" id="resetSel" disabled>恢复规则价</button>
    </div>
    <div class="stat" id="stat"></div>
  </div>

  <div class="grid-scroll" id="gridScroll">
    <table class="grid" id="grid"></table>
  </div>

  <div class="foot">
    <div>
      <b>改价只影响之后的新预约。</b>已提交订单的价格在下单时已锁定，不会被追溯修改。
      <span id="legendNote"></span>
    </div>
    <div class="foot-bar">
      <span id="storageWarn" class="warn"></span>
      <button class="mini danger" id="resetData">清空全部数据</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>

<script src="core.js"></script>
<script>
const $ = id => document.getElementById(id);

let currentDay = 0;
const sel = new Set();          // 管理端选择："ci|min"（只针对当前日期）

/* ── 日期条 ─────────────────────────────────────── */
function renderDates() {
  const bar = $('datebar');
  bar.innerHTML = '';
  DATES.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'date' + (i === currentDay ? ' active' : '');
    el.innerHTML = `<div class="dow">${dateLabel(d, i)}</div>
                    <div class="dnum">${d.getMonth() + 1}/${d.getDate()}</div>`;
    el.onclick = () => {
      if (i === currentDay) return;
      currentDay = i;
      sel.clear();
      renderDates();
      renderGrid();
    };
    bar.appendChild(el);
  });
}

/* ── 网格 ───────────────────────────────────────── */
function renderGrid() {
  const n = CONFIG.courts.length;

  let html = '<thead><tr><th class="corner">时间</th>';
  CONFIG.courts.forEach(c => { html += `<th>${c}</th>`; });
  html += '</tr></thead><tbody>';

  HOURS.forEach(h => {
    html += `<tr><td class="time">${fmt(h)}</td>`;
    for (let ci = 0; ci < n; ci++) {
      html += '<td class="hour"><div class="halves">';
      for (let k = 0; k < 2; k++) {
        const min = h + k * CONFIG.slotMin;
        if (min >= CONFIG.closeHour * 60) {
          html += '<div class="half" style="visibility:hidden"></div>';
          continue;
        }
        html += `<div class="${cellClass(ci, min)}" data-ci="${ci}" data-min="${min}">
                   ${priceFor(currentDay, ci, min)}</div>`;
      }
      html += '</div></td>';
    }
    html += '</tr>';
  });

  $('grid').innerHTML = html + '</tbody>';
  $('grid').style.minWidth = (50 + n * 66) + 'px';
  renderTools();
}

function cellClass(ci, min) {
  let cls = 'half';
  if (hasOverride(currentDay, ci, min)) cls += ' override';
  const st = slotStatus(currentDay, ci, min);
  if (st === 'past')            cls += ' past';
  else if (st === CONFIRMED)    cls += ' booked';
  else if (st === PENDING)      cls += ' pending';
  if (sel.has(`${ci}|${min}`))  cls += ' sel';
  return cls;
}

/** 只重画一格，避免整表重排打断拖动 */
function repaint(ci, min) {
  const el = $('grid').querySelector(`.half[data-ci="${ci}"][data-min="${min}"]`);
  if (!el) return;
  el.className = cellClass(ci, min);
  el.textContent = priceFor(currentDay, ci, min);
}

/* ── 拖动 / 点击选择 ─────────────────────────────
   用 pointer 事件 + elementFromPoint，鼠标和触屏都能用
   ─────────────────────────────────────────────── */
let dragging = false;
let downKey = null, wasSelected = false, moved = false;

function halfAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.classList && el.classList.contains('half') && el.dataset.ci
    ? el : null;
}

function paint(k) { const [ci, m] = k.split('|').map(Number); repaint(ci, m); }

function clearAll() {
  const old = [...sel];
  sel.clear();
  old.forEach(paint);
}

$('grid').addEventListener('pointerdown', e => {
  const el = halfAt(e.clientX, e.clientY);
  if (!el) return;
  e.preventDefault();

  downKey = `${el.dataset.ci}|${el.dataset.min}`;
  wasSelected = sel.has(downKey);
  moved = false;
  dragging = true;

  if (!e.shiftKey && !wasSelected) clearAll();   // 不按 Shift = 重新开始选
  sel.add(downKey);
  paint(downKey);
  renderTools();
});

window.addEventListener('pointermove', e => {
  if (!dragging) return;
  if (!moved) moved = true;                      // 区分"拖动"和"单击"
  const el = halfAt(e.clientX, e.clientY);
  if (!el) return;
  const k = `${el.dataset.ci}|${el.dataset.min}`;
  if (sel.has(k)) return;
  sel.add(k);
  paint(k);
  renderTools();
});

window.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  // 单击一个已选中的格子 = 取消它（拖选时不触发）
  if (!moved && wasSelected && sel.size === 1 && downKey) {
    sel.delete(downKey);
    paint(downKey);
  }
  renderTools();
});

/* ── 工具栏状态 ─────────────────────────────────── */
function renderTools() {
  const n = sel.size;
  $('selCount').textContent = n;
  $('clearSel').disabled = n === 0;
  $('applyBtn').disabled = n === 0;
  $('resetSel').disabled = n === 0;

  // 本日统计
  let ov = 0, total = 0;
  CONFIG.courts.forEach((_, ci) => SLOTS.forEach(min => {
    total++;
    if (hasOverride(currentDay, ci, min)) ov++;
  }));
  $('stat').innerHTML = `本日共 ${total} 格，其中 <b>${ov}</b> 格已手动改价`;

  $('legendNote').textContent =
    '　绿=规则价，橙=手改价（带点），黄=待确认，灰=已确认。';

  const p = countByStatus(PENDING);
  const badge = $('pendingBadge');
  badge.textContent = p;
  badge.classList.toggle('zero', p === 0);
}

/* ── 应用改价 ───────────────────────────────────── */
$('applyBtn').onclick = () => {
  const v = parseInt($('priceInput').value, 10);
  if (!Number.isFinite(v) || v < 0 || v > 9999) {
    toast('请输入 0–9999 之间的价格');
    return;
  }
  sel.forEach(k => {
    const [ci, min] = k.split('|').map(Number);
    setOverride(currentDay, ci, min, v);
    repaint(ci, min);
  });
  renderTools();
  toast(`已将 ${sel.size} 个时段设为 ¥${v}`);
};

/* ── 恢复规则价 ─────────────────────────────────── */
$('resetSel').onclick = () => {
  sel.forEach(k => {
    const [ci, min] = k.split('|').map(Number);
    clearOverride(currentDay, ci, min);
    repaint(ci, min);
  });
  renderTools();
  toast(`已恢复 ${sel.size} 个时段的规则价`);
};

/* ── 清空选择 ───────────────────────────────────── */
$('clearSel').onclick = () => {
  const old = [...sel];
  sel.clear();
  old.forEach(k => { const [ci, m] = k.split('|').map(Number); repaint(ci, m); });
  renderTools();
};

// 回车快捷键
$('priceInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !$('applyBtn').disabled) $('applyBtn').click();
});

/* ── 提示 ───────────────────────────────────────── */
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ── 清空数据 ───────────────────────────────────── */
$('resetData').onclick = () => {
  if (!confirm('确定清空全部预约记录和改价吗？\n此操作不可撤销。')) return;
  clearAllData();
  sel.clear();
  renderDates();
  renderGrid();
  toast('已清空全部数据');
};

/* ── 启动 ───────────────────────────────────────── */
seedDemoBookings();
renderDates();
renderGrid();

if (!STORAGE_OK) {
  $('storageWarn').textContent = '⚠️ 当前环境不支持本地存储，数据无法跨页面保存';
}
</script>

</body>
</html>
